name: 宿題のリマインダー

on:
  schedule:
    - cron: '0 0 * * *'    # 毎日 0:00 UTC ＝ 日本時間の朝9時
  workflow_dispatch:        # 手で動かすボタン

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet cryptography

      - name: 7日前のアカデミーを確認して送る
        env:
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          LW_BOT_ID:          ${{ secrets.LW_BOT_ID }}
          LW_CLIENT_ID:       ${{ secrets.LW_CLIENT_ID }}
          LW_CLIENT_SECRET:   ${{ secrets.LW_CLIENT_SECRET }}
          LW_SERVICE_ACCOUNT: ${{ secrets.LW_SERVICE_ACCOUNT }}
          LW_PRIVATE_KEY:     ${{ secrets.LW_PRIVATE_KEY }}
        run: python homework/reminder.py
